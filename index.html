<!DOCTYPE html>
<html lang="en" class="h-100" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Johan van der Heide, johan.van.der.heide@itea4.org" />
  <meta name="description" content="Eureka Clusters PA Portal"/>
  <script>
    (() => {
      const storedTheme = window.localStorage.getItem("portal-theme");
      const theme = storedTheme === "light" || storedTheme === "dark" ? storedTheme : "dark";
      document.documentElement.setAttribute("data-bs-theme", theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <title>Eureka Clusters PA Portal</title>
</head>
<body class="h-100 bg-body text-body">
  <div id="root" class="d-flex flex-column h-100"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
